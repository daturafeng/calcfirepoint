[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firepoint-geolocation-core"
version = "0.1.0"
description = "Terrain-ray intersection core for image-based fire-point geolocation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "Pillow>=10.0",
  "python-multipart>=0.0.9",
  "rasterio>=1.3,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.0"]

[project.scripts]
firepoint-geolocate = "firepoint_core.cli:main"
firepoint-api = "firepoint_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
